name: Build and release Linux amd64 plugin

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zyycn/codex-proxy-rs
          ref: 16d8a3f87309d9346a5f204673390fe20478b40e
          path: temp/codex-proxy-rs
      - name: Install Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Check version
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('plugin.json').read_text(encoding='utf-8'))
          assert os.environ['GITHUB_REF_NAME'] == f"v{manifest['version']}"
          PY
      - name: Check and build plugin
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Package plugin
        run: |
          cargo run --manifest-path temp/codex-proxy-rs/backend/Cargo.toml \
            -p codex-proxy-plugin-cli --release --locked -- package \
            --manifest plugin.json \
            --binary target/x86_64-unknown-linux-gnu/release/cpr-plugin-imgen \
            --target x86_64-unknown-linux-gnu \
            --output-dir dist
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes 'Imgen 图片编辑请求适配；Linux amd64，使用 RPC v4、middleware v5，兼容 CPR 3.29.3 及清单声明的版本范围。CPR 3.29.0 起已原生支持 multipart 图片编辑，通常无需启用此插件。' \
            --latest
